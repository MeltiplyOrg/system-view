name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+ and dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Format, lint, and type-check
        run: vp check

      - name: Verify TypeScript
        run: bun run typecheck

      - name: Unit tests with coverage
        run: vp test run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: vp build

      - name: Enforce bundle budgets
        run: bun run size

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: Browser end-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+ and dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run Playwright suite
        run: vp exec playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Set up Vite+ and dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Audit dependencies
        run: bun audit --audit-level=high
